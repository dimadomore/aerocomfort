# Seasonal offers (docs/05 §3.4). Edit this one file to update the offers page.
#
# Prices: owner's list, Nov 2026. Specs: the manufacturers' data sheets the owner
# sent in Nov 2026 (Giatsu AROMA 3, LG WiFi Pro, LG Infinity, Panasonic BZ,
# Mitsubishi MSZ-HR, Daikin Sensira 2026 price list). Every number below is read
# from those sheets; do not add a spec that is not on the sheet.
#
# priceOld keeps each unit's earlier saving on top of the new price (owner's rule,
# Nov 2026): Giatsu 100, LG 110, Panasonic 90, Mitsubishi 120, Daikin 120.
# All six units have Wi-Fi (owner, Nov 2026).

season:
  start: "10-01"
  end: "04-30"
  label:
    en: "Valid 1 Oct – 30 Apr"
    es: "Válido del 1 oct al 30 abr"

# What the offer price covers. Owner's wording (Nov 2026), EN and ES as supplied.
installation:
  title:
    en: "Basic installation of a split air conditioning system includes:"
    es: "La instalación básica de un aire acondicionado tipo Split incluye:"
  items:
    en:
      - "Up to 3 metres of copper refrigerant pipes connecting the indoor and outdoor units."
      - "Electrical power supply cable."
      - "Interconnecting electrical and communication cable between the indoor and outdoor units."
      - "Mounting brackets for the outdoor unit."
      - "Standard installation materials and connections."
      - "System commissioning and operation check."
    es:
      - "Hasta 3 metros de tuberías de cobre frigorífico para conectar la unidad interior con la unidad exterior."
      - "Cable de alimentación eléctrica."
      - "Cable de interconexión eléctrica y comunicación entre la unidad interior y la unidad exterior."
      - "Soportes de fijación para la unidad exterior."
      - "Materiales y conexiones necesarios para la instalación estándar."
      - "Puesta en marcha y comprobación del funcionamiento del equipo."

